# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: Serein-Xi/serein-xi.github.io
  branch: main

media_folder: assets/uploads
public_folder: /assets/uploads

collections:
  - name: site_pages
    label: Website Pages
    label_singular: Page
    format: raw
    files:
      - name: home
        label: Home / Introduction
        file: content/pages/intro.md
        fields:
          - { name: body, label: Page content, widget: richtext }
      - name: news
        label: News
        file: content/pages/news.md
        fields:
          - { name: body, label: Page content, widget: richtext }
      - name: research
        label: Research Overview
        file: content/pages/research.md
        fields:
          - { name: body, label: Page content, widget: richtext }
      - name: about
        label: About Me
        file: content/pages/about.md
        fields:
          - { name: body, label: Page content, widget: richtext }
      - name: note_xenonnt
        label: Notes · XENONnT
        file: content/pages/notes/xenonnt.md
        fields:
          - { name: body, label: Page content, widget: richtext }
      - name: note_qft
        label: Notes · Quantum Field Theory
        file: content/pages/notes/qft.md
        fields:
          - { name: body, label: Page content, widget: richtext }
      - name: note_statphys
        label: Notes · Statistical Physics
        file: content/pages/notes/statphys.md
        fields:
          - { name: body, label: Page content, widget: richtext }

  - name: projects
    label: Projects
    label_singular: Project Page
    format: raw
    files:
      - name: overview
        label: 'Projects Overview'
        file: content/pages/projects.md
        fields:
          - { name: body, label: Page content, widget: richtext }
      - name: solar_pp
        label: 'Solar-pp Analysis: Event Reconstruction & Cut Acceptance'
        file: content/pages/projects/solar-pp.md
        fields:
          - { name: body, label: Page content, widget: richtext }
      - name: xenonnt_calibration
        label: 'XENONnT Detector Calibration & Energy Reconstruction'
        file: content/pages/projects/xenonnt-calibration.md
        fields:
          - { name: body, label: Page content, widget: richtext }
      - name: discrete_diffusion
        label: 'Probing Metastability and Free-Energy Barriers with Discrete Diffusion Models'
        file: content/pages/projects/discrete-diffusion.md
        fields:
          - { name: body, label: Page content, widget: richtext }
      - name: potts_phase_transitions
        label: 'Machine-Learning Detection of Potts-Model Phase Transitions'
        file: content/pages/projects/potts-phase-transitions.md
        fields:
          - { name: body, label: Page content, widget: richtext }
      - name: airy_wkb
        label: 'Numerical Analysis of the Airy Equation in the WKB Approximation'
        file: content/pages/projects/airy-wkb.md
        fields:
          - { name: body, label: Page content, widget: richtext }
