
name: Deploy Shiroa Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Shiroa
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/Myriad-Dreamin/shiroa/releases/download/v0.3.0/shiroa-installer.sh \
            -o /tmp/shiroa-installer.sh

          sh /tmp/shiroa-installer.sh

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Prepare CMS content
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          python3 scripts/build_cms.py

      - name: Build website
        run: |
          shiroa --version
          shiroa build --path-to-root / --dest-dir dist
          test -f dist/index.html
          cp -a admin dist/admin
          if [ -d assets ]; then cp -a assets dist/assets; fi
          touch dist/.nojekyll
          test -f dist/admin/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Wait for artifact availability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 20); do
            count=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length' \
              || echo 0)

            if [ "$count" -gt 0 ]; then
              echo "Artifact is available."
              sleep 3
              exit 0
            fi

            echo "Waiting for artifact ($i/20)..."
            sleep 5
          done

          echo "Artifact not available in time."
          exit 1

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
